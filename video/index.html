<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meriva launch</title>
<style>
@font-face{font-family:Mont;src:url(../assets/fonts/montserrat-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Mont;src:url(../assets/fonts/montserrat-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Mont;src:url(../assets/fonts/montserrat-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Mont;src:url(../assets/fonts/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Mont;src:url(../assets/fonts/montserrat-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:Cinzel;src:url(../assets/fonts/cinzel-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Corm;src:url(../assets/fonts/cormorant-garamond-latin-600-italic.woff2);font-weight:600;font-style:italic}
@font-face{font-family:Inter;src:url(../assets/fonts/Inter-SemiBold.otf);font-weight:600}

:root{--navy:#002C69;--royal:#035EA6;--sky:#1E8DD2;--orange:#FA7A11;--amber:#FDA01A;--bone:#F7F5F1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;width:1080px;height:1920px;overflow:hidden;background:var(--bone)}
.abs{position:absolute;left:0;top:0}
.layer{position:absolute;inset:0}

/* ── hook ─────────────────────────────────── */
#hook{background:radial-gradient(150% 62% at 50% 52%,#081f47 0%,#081f47 52%,#04122b 82%,#020B1C 100%)}
#hookGlow{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 55%,rgba(250,122,17,.55),transparent 70%);opacity:0;mix-blend-mode:screen}
#hookStack{position:absolute;inset:0;transform-origin:540px 960px}
.hw{position:absolute;left:60px;font-family:Mont;font-weight:900;color:#fff;white-space:nowrap;line-height:1;letter-spacing:-.02em;transform-origin:50% 50%;will-change:transform}
.hw.accent{color:var(--orange)}
#hookLabel{position:absolute;top:118px;left:0;width:1080px;text-align:center;font:600 22px Mont;letter-spacing:.42em;color:rgba(255,255,255,.55)}

/* ── light world ──────────────────────────── */
#light{background:var(--bone);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
#watermark{position:absolute;width:1700px;left:-310px;top:260px;opacity:.06}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(0,44,105,.13) 1.4px,transparent 1.6px);background-size:36px 36px;opacity:.55}
#titleScrim{position:absolute;left:0;top:0;width:1080px;height:560px;background:linear-gradient(var(--bone) 62%,rgba(247,245,241,0));z-index:5;opacity:0}
.title{position:absolute;left:0;top:0;width:1080px;z-index:6}
.tag{position:absolute;top:150px;width:1080px;text-align:center;font:700 28px Mont;letter-spacing:.34em;color:var(--orange);white-space:nowrap}
.bigRow{position:absolute;top:190px;width:1080px;height:250px;overflow:hidden;text-align:center;white-space:nowrap}
.big{display:inline-block;font-family:Mont;font-weight:900;color:var(--navy);line-height:1;letter-spacing:-.02em}
.big.cinzel{font-family:Cinzel;font-weight:600;letter-spacing:.02em}
.big span{display:inline-block;will-change:transform}
.big .dot{color:var(--orange)}
.sub{position:absolute;top:448px;width:1080px;text-align:center;font:italic 600 50px Corm;color:var(--navy);white-space:nowrap}

/* ── phone ────────────────────────────────── */
#phoneCam{position:absolute;left:0;top:0;transform-origin:0 0;z-index:3}
#phone3d{position:absolute;left:0;top:0;transform-origin:195px 398px}
#phoneShadow{position:absolute;left:-10px;top:-40px;width:410px;height:900px;border-radius:70px;background:rgba(0,30,80,.55);filter:blur(46px);transform:translate(0,40px)}
#phoneBody{position:absolute;left:-14px;top:-61px;width:418px;height:919px;border-radius:62px;background:linear-gradient(145deg,#2a3448,#0b1120 40%,#05080f);box-shadow:inset 0 0 0 2px #3b465c,inset 0 0 0 5px #0a0f19}
#screen{position:absolute;left:14px;top:14px;width:390px;height:891px;border-radius:48px;overflow:hidden;background:#FAF9F7}
#status{position:absolute;left:0;top:0;width:390px;height:47px;background:#FAF9F7}
#status .time{position:absolute;left:44px;top:15px;font:600 16px Inter;color:#16211f}
#status svg{position:absolute;right:30px;top:17px}
#island{position:absolute;left:146px;top:25px;width:126px;height:36px;border-radius:20px;background:#000}
#content{position:absolute;left:0;top:47px;width:390px;height:844px;overflow:hidden;background:#FAF9F7}
.scr{position:absolute;left:0;top:0;width:390px;height:844px;display:block}
.crop{position:absolute;background-repeat:no-repeat;background-size:390px 844px}
#homeScroll{position:absolute;left:0;top:0;width:390px;height:844px;overflow:hidden}
#homeScroll .full{position:absolute;left:0;top:0;width:390px;height:1924px}
#pieces{position:absolute;left:0;top:0}
#pieces .crop{will-change:transform}
#overlay{position:absolute;left:0;top:0}
#cursor{position:absolute;left:0;top:0;width:34px;height:46px;transform-origin:0 0;filter:drop-shadow(0 4px 6px rgba(0,20,60,.35))}
.ripple{position:absolute;left:0;top:0;border-radius:50%;border:3px solid var(--orange);background:rgba(250,122,17,.18)}
.press{position:absolute;background-repeat:no-repeat;transform-origin:50% 50%}
.hl{position:absolute;left:0;top:0;overflow:visible}
.confetti{position:absolute;left:0;top:0;transform-origin:50% 50%}
.callout{position:absolute;left:0;top:0;transform-origin:50% 50%;background-size:390px 844px;background-repeat:no-repeat;border-radius:6px;background-color:#fff}

/* ── logo world ───────────────────────────── */
#logo{background:radial-gradient(90% 60% at 50% 45%,#ffffff 0%,#fbfaf7 55%,#efebe4 100%)}
#logoRig{position:absolute;inset:0;transform-origin:540px 950px}
.lp{position:absolute;display:block;will-change:transform}
#markGlow{position:absolute;left:290px;top:420px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(253,160,26,.55),rgba(30,141,210,.25) 45%,transparent 70%);filter:blur(20px);opacity:0}
.shock{position:absolute;border-radius:50%;border:4px solid var(--orange);opacity:0}
#sweep{position:absolute;-webkit-mask-size:100% 100%;mask-size:100% 100%;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);background-size:300% 100%;background-repeat:no-repeat}
#cta{position:absolute;left:540px;top:1335px;display:flex;align-items:center;gap:22px;padding:26px 56px 28px 40px;border-radius:999px;background:var(--navy);box-shadow:0 26px 60px rgba(0,44,105,.35);white-space:nowrap;transform-origin:50% 50%}
#cta .l1{font:700 40px Mont;color:#fff;letter-spacing:.005em}
#cta .l2{font:700 25px Mont;color:var(--amber);letter-spacing:.46em;margin-top:6px}

/* ── fx ───────────────────────────────────── */
#iris{position:absolute;left:540px;top:960px;border-radius:50%;border:10px solid var(--orange);opacity:0;z-index:20}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:21;pointer-events:none}
#grain{position:absolute;inset:-64px;opacity:.07;mix-blend-mode:overlay;z-index:22}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse 85% 70% at 50% 50%,transparent 60%,rgba(0,10,30,.32) 100%);z-index:22}
.corner{position:absolute;width:34px;height:34px;border-color:rgba(0,44,105,.35);border-style:solid;border-width:0;z-index:23}
</style>
</head>
<body>
<div id="stage">

  <!-- 1 · HOOK -->
  <div id="hook" class="layer">
    <div id="hookGlow"></div>
    <div id="hookLabel">MERIVA MEDICAL CENTRE · COIMBATORE</div>
    <div id="hookStack"></div>
  </div>

  <!-- 2–3 · PRODUCT + FEATURES -->
  <div id="light" class="layer">
    <div class="blob" id="blobA" style="width:900px;height:900px;background:#035EA6"></div>
    <div class="blob" id="blobB" style="width:800px;height:800px;background:#FA7A11"></div>
    <div class="blob" id="blobC" style="width:620px;height:620px;background:#1E8DD2"></div>
    <div id="grid"></div>
    <img id="watermark" src="../assets/logo/mark.png">
    <div id="titleScrim"></div>
    <div id="callouts" style="position:absolute;inset:0;z-index:7"></div>
    <div id="titles"></div>

    <div id="phoneMask" class="layer" style="z-index:3">
    <div id="phoneCam">
      <div id="phone3d">
        <div id="phoneShadow"></div>
        <div id="phoneBody">
          <div id="screen">
            <div id="status">
              <div class="time">9:41</div>
              <svg width="78" height="14" viewBox="0 0 78 14"><g fill="#16211f"><rect x="0" y="9" width="3.2" height="4.5" rx="1"/><rect x="5" y="6.5" width="3.2" height="7" rx="1"/><rect x="10" y="4" width="3.2" height="9.5" rx="1"/><rect x="15" y="1.2" width="3.2" height="12.3" rx="1"/><path d="M30.5 4.2a9.6 9.6 0 0 1 13 0l-1.4 1.5a7.6 7.6 0 0 0-10.2 0zM33.2 7.1a5.6 5.6 0 0 1 7.6 0l-1.4 1.5a3.6 3.6 0 0 0-4.8 0zM37 13l-2.2-2.4a3 3 0 0 1 4.4 0z"/><rect x="51" y="1.5" width="23" height="11.5" rx="3.4" fill="none" stroke="#16211f" stroke-opacity=".45" stroke-width="1"/><rect x="53" y="3.5" width="17.5" height="7.5" rx="2"/><rect x="75.2" y="5" width="1.6" height="4.5" rx=".8" fill-opacity=".45"/></g></svg>
            </div>
            <div id="content"></div>
          </div>
          <div id="island"></div>
        </div>
        <div id="pieces"></div>
        <div id="overlay"></div>
      </div>
    </div>
    </div>
  </div>

  <!-- 4 · LOGO -->
  <div id="logo" class="layer">
    <div id="logoRig">
      <div id="markGlow"></div>
      <div id="shocks"></div>
      <div id="petals"></div>
      <img class="lp" id="wmText" src="../assets/logo/wordmark_text.png">
      <img class="lp" id="wmSwoosh" src="../assets/logo/wordmark_swoosh.png">
      <div id="sweep"></div>
      <img class="lp" id="desc" src="../assets/logo/descriptor.png">
      <img class="lp" id="tag" src="../assets/logo/tagline.png">
      <div id="cta">
        <svg width="54" height="54" viewBox="0 0 24 24"><path fill="#FA7A11" d="M12 2.2a7.3 7.3 0 0 0-7.3 7.3c0 5.2 6.2 11.6 6.5 11.9.4.4 1.1.4 1.5 0 .3-.3 6.6-6.7 6.6-11.9A7.3 7.3 0 0 0 12 2.2z"/><circle cx="12" cy="9.5" r="2.7" fill="#002C69"/></svg>
        <div><div class="l1">Visit Meriva Medical Centre</div><div class="l2">COIMBATORE</div></div>
      </div>
    </div>
  </div>

  <div id="iris"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
  <div class="corner" id="c0" style="left:40px;top:40px;border-left-width:3px;border-top-width:3px"></div>
  <div class="corner" id="c1" style="right:40px;top:40px;border-right-width:3px;border-top-width:3px"></div>
  <div class="corner" id="c2" style="left:40px;bottom:40px;border-left-width:3px;border-bottom-width:3px"></div>
  <div class="corner" id="c3" style="right:40px;bottom:40px;border-right-width:3px;border-bottom-width:3px"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Deterministic motion: render(t) sets every style from t alone. 120 BPM.
// ═══════════════════════════════════════════════════════════════════════════
const BEAT = 0.5, DUR = 15;
const $ = (s) => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, x) => a + (b - a) * x;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: x => x,
  oCub: x => 1 - Math.pow(1 - x, 3),
  iCub: x => x * x * x,
  ioCub: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  oQuint: x => 1 - Math.pow(1 - x, 5),
  oExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  iExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  ioExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  oBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spring: x => x >= 1 ? 1 : 1 - Math.exp(-7 * x) * Math.cos(2.6 * Math.PI * x),
};
const tw = (t, a, b, v0, v1, e = E.oCub) => lerp(v0, v1, e(P(t, a, b)));
// keyframes: [[t, v], [t, v, ease], ...] — ease belongs to the segment arriving at that key
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    if (t <= t1) { const [t0, v0] = keys[i - 1]; const x = (e || E.ioCub)(P(t, t0, t1));
      return Array.isArray(v0) ? v0.map((a, j) => lerp(a, v1[j], x)) : lerp(v0, v1, x); }
  }
  return keys[keys.length - 1][1];
}
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; }
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const css = (el, o) => { for (const k in o) el.style[k] = o[k]; };
const vis = (el, on) => { el.style.display = on ? '' : 'none'; };

// ── assets ────────────────────────────────────────────────────────────────
const SCR = '../assets/screens/';
const SCREENS = ['home', 'home_labhover', 'lab', 'family_sheet', 'family_switched', 'book_spec', 'book_doc',
  'book_slot', 'book_slot_hover', 'book_confirm_hover', 'book_done'];
const PETALS = [[193,47,247,131],[146,92,205,145],[234,92,294,146],[198,135,242,179],[123,137,195,178],[245,137,317,178],[146,168,205,220],[235,169,293,220],[193,182,246,255]];
const CROSS = 3, PETAL_ORDER = [0, 2, 5, 7, 8, 6, 4, 1];   // clockwise from the top
const LK = 2.35, LX = 540, LY0 = 420;                          // logo source px -> canvas
const lx = sx => LX + (sx - 220) * LK, ly = sy => LY0 + (sy - 46) * LK;

// ── timeline constants (seconds; every hit sits on the 120 BPM grid) ─────────
const HOOK_BG = '#081f47';
const HOOK_WORDS = [['HEALTHCARE', 0.0, [-1, 0]], ["SHOULDN'T", 0.5, [1, 0]], ['FEEL', 1.0, [0, -1]], ['THIS', 1.5, [0, 1]], ['HARD.', 2.0, [0, 0]]];
const CLICKS = [5.5, 6.5, 7.0, 8.5, 10.5, 11.0];
const ASSEMBLY = [ // [name, x, y, w, h, land, from:[dx,dy,rot,scale]]
  ['header', 0, 0, 390, 65, 3.375, [0, -240, 0, 1]],
  ['greet', 0, 76, 390, 76, 3.5, [-430, 0, -7, 1]],
  ['nextLabel', 20, 172, 200, 26, 3.5625, [0, -80, 0, 1]],
  ['apptCard', 16, 201, 358, 205, 3.625, [0, 30, 0, 1.45]],
  ['healthLabel', 20, 428, 200, 26, 3.75, [-200, 0, 0, 1]],
  ['meds', 16, 456, 358, 86, 3.875, [470, 60, 9, 1]],
  ['lab', 16, 544, 358, 86, 4.0, [-470, 60, -9, 1]],
  ['follow', 16, 632, 358, 86, 4.125, [470, 60, 9, 1]],
  ['pay', 16, 720, 358, 67, 4.25, [-470, 60, -9, 1]],
  ['nav', 0, 787, 390, 57, 4.375, [0, 220, 0, 1]],
];
const TITLES = [ // tag, big word, sub, in(land), out, cinzel
  ['INTRODUCING THE', 'MERIVA APP', 'Your clinic, in your pocket.', 3.0, 5.75, true],
  ['01 — BOOKING', 'BOOK.', "Pick a time. You're confirmed.", 6.0, 7.75],
  ['02 — LAB REPORTS', 'REPORTS.', 'Every result, with its range.', 8.0, 9.75],
  ['03 — FAMILY', 'FAMILY.', 'Everyone you care for, one app.', 10.0, 11.625],
];

// ── build DOM ─────────────────────────────────────────────────────────────
const content = $('#content'), pieces = $('#pieces'), overlay = $('#overlay');
const scr = {};
for (const n of SCREENS) { const im = new Image(); im.src = SCR + n + '.png'; im.className = 'scr'; content.appendChild(im); scr[n] = im; }
// scrollable home: real full-page capture under the sticky header + fixed tab bar
const homeScroll = document.createElement('div'); homeScroll.id = 'homeScroll';
homeScroll.innerHTML = `<img class="full" src="${SCR}home_full.png">
  <div class="crop" style="left:0;top:0;width:390px;height:65px;background-image:url(${SCR}home.png);background-position:0 0"></div>
  <div class="crop" style="left:0;top:787px;width:390px;height:57px;background-image:url(${SCR}home.png);background-position:0 -787px"></div>`;
content.appendChild(homeScroll);
// bottom sheet pieces for the family switcher
const sheetTop = document.createElement('div'), sheetPanel = document.createElement('div');
for (const [el, y, h] of [[sheetTop, 0, 370], [sheetPanel, 370, 474]]) {
  el.className = 'crop'; css(el, { left: '0px', top: y + 'px', width: '390px', height: h + 'px', backgroundImage: `url(${SCR}family_sheet.png)`, backgroundPosition: `0 ${-y}px` });
  content.appendChild(el);
}
const pieceEls = ASSEMBLY.map(([n, x, y, w, h]) => {
  const d = document.createElement('div'); d.className = 'crop';
  css(d, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px', backgroundImage: `url(${SCR}home.png)`, backgroundPosition: `${-x}px ${-y}px`, transformOrigin: '50% 50%' });
  pieces.appendChild(d); return d;
});
// press overlay, ripples, highlight ring, confetti, cursor
const press = document.createElement('div'); press.className = 'press'; overlay.appendChild(press);
const ripples = CLICKS.map(() => { const r = document.createElement('div'); r.className = 'ripple'; overlay.appendChild(r); return r; });
const hl = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); hl.setAttribute('class', 'hl'); hl.setAttribute('width', 400); hl.setAttribute('height', 860);
hl.innerHTML = `<rect id="hlRect" fill="rgba(250,122,17,.08)" stroke="#FA7A11" stroke-width="3.5" rx="12" pathLength="100" stroke-dasharray="100" />`;
overlay.appendChild(hl);
const confetti = []; { const r = rng(7);
  for (let i = 0; i < 26; i++) { const im = new Image(); im.src = `../assets/logo/petal_${[0,1,2,4,5,6,7,8][i % 8]}.png`; im.className = 'confetti'; overlay.appendChild(im);
    const a = -Math.PI / 2 + (r() - .5) * 3.0, sp = 420 + r() * 620;
    confetti.push({ el: im, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: (r() - .5) * 900, s: 0.045 + r() * 0.05, d: r() * .08 }); } }
const calloutEls = [0, 1].map(() => { const d = document.createElement('div'); d.className = 'callout'; $('#callouts').appendChild(d); return d; });
const cursor = document.createElement('div'); cursor.id = 'cursor';
cursor.innerHTML = `<svg width="34" height="46" viewBox="0 0 34 46"><path d="M3 2.5v35.2l9.2-8.6 6.1 13.6 6.8-3-6-13.4h12.6z" fill="#fff" stroke="#002C69" stroke-width="2.6" stroke-linejoin="round"/></svg>`;
overlay.appendChild(cursor);

// hook words
const hookStack = $('#hookStack');
const hookEls = HOOK_WORDS.map(([w], i) => { const d = document.createElement('div'); d.className = 'hw' + (i === 4 ? ' accent' : ''); d.textContent = w; hookStack.appendChild(d); return d; });

// titles
const titleEls = TITLES.map(([tag, big, sub, , , cin]) => {
  const g = document.createElement('div'); g.className = 'title';
  const letters = [...big].map(ch => ch === '.' ? `<span class="dot">.</span>` : ch === ' ' ? `<span>&nbsp;</span>` : `<span>${ch}</span>`).join('');
  g.innerHTML = `<div class="tag">${tag}</div><div class="bigRow"><div class="big${cin ? ' cinzel' : ''}">${letters}</div></div><div class="sub">${sub}</div>`;
  $('#titles').appendChild(g); return g;
});

// logo petals + rings
const petalEls = PETALS.map((b, i) => { const im = new Image(); im.src = `../assets/logo/petal_${i}.png`; im.className = 'lp';
  css(im, { left: lx(b[0]) + 'px', top: ly(b[1]) + 'px', width: (b[2] - b[0]) * LK + 'px', height: (b[3] - b[1]) * LK + 'px', transformOrigin: '50% 50%' });
  $('#petals').appendChild(im); return im; });
const shocks = [0, 1, 2].map(() => { const d = document.createElement('div'); d.className = 'shock'; $('#shocks').appendChild(d); return d; });
function placeLogo(el, b) { css(el, { left: lx(b[0]) + 'px', top: ly(b[1]) + 'px', width: (b[2] - b[0]) * LK + 'px', height: (b[3] - b[1]) * LK + 'px' }); }
placeLogo($('#wmText'), [33, 255, 407, 324]); placeLogo($('#wmSwoosh'), [33, 255, 407, 324]); placeLogo($('#sweep'), [33, 255, 407, 324]);
placeLogo($('#desc'), [38, 334, 401, 353]); placeLogo($('#tag'), [75, 368, 364, 392]);
css($('#sweep'), { webkitMaskImage: 'url(../assets/logo/wordmark_text.png)', maskImage: 'url(../assets/logo/wordmark_text.png)' });

{ const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'); const id = g.createImageData(256, 256); const r = rng(42);

    shocks.forEach((sh, i) => { const st = 13 + i * 0.07; const p = P(t, st, st + .7); const R = 120 + 720 * E.oExpo(p);

    // wordmark: tracks in from wide + sharpens, then the swoosh paints across the A
    const w = E.oExpo(P(t, 13.0, 13.45));
    css($('#wmText'), { opacity: w, transform: `translateY(${(1 - w) * 40}px) scaleX(${lerp(1.18, 1, w)})`, filter: `blur(${(1 - w) * 12}px)`, clipPath: `inset(0 ${50 * (1 - w)}% 0 ${50 * (1 - w)}%)` });
    const sw = E.ioCub(P(t, 13.3, 13.62));
    css($('#wmSwoosh'), { opacity: 1, clipPath: `inset(0 ${100 - lerp(80, 100, sw)}% 0 0)` });
    if (t < 13.3) $('#wmSwoosh').style.opacity = 0;
    const sp = P(t, 14.25, 14.85); css($('#sweep'), { opacity: sp > 0 && sp < 1 ? 1 : 0, backgroundPosition: `${lerp(120, -20, E.ioCub(sp))}% 0` });
    const d = E.oExpo(P(t, 13.45, 13.85));
    css($('#desc'), { clipPath: `inset(0 ${50 * (1 - d)}% 0 ${50 * (1 - d)}%)`, opacity: d });
    const tg = E.oExpo(P(t, 13.7, 14.15));
    css($('#tag'), { opacity: tg, transform: `translateY(${(1 - tg) * 26}px)`, filter: `blur(${(1 - tg) * 8}px)` });
    const c = P(t, 13.9, 14.25);
    css($('#cta'), { opacity: clamp(c * 3), transform: `translateY(${(1 - E.oExpo(c)) * 60}px) scale(${t < 14.25 ? lerp(.7, 1, E.oBack(c)) : 1 + .05 * Math.exp(-(t - 14.25) * 10) * Math.cos((t - 14.25) * 30)})` });
    const pin = $('#cta svg'); pin.style.transform = `translateY(${-14 * Math.abs(Math.sin(P(t, 14.0, 14.55) * Math.PI)) * (1 - P(t, 14, 14.55))}px)`;
  }

  // ── FX ─────────────────────────────────────────────────────────────────
  const FL = [[2.0, .35], [3.0, .55], [11.98, .9]];
  let fl = 0; for (const [h, a] of FL) if (t >= h) fl += a * Math.exp(-(t - h) * 12);
  $('#flash').style.opacity = Math.min(1, fl);
  const fi = Math.floor(t * 60); css($('#grain'), { transform: `translate(${-hash(fi) * 64}px,${-hash(fi + 99) * 64}px)`, opacity: hookOn ? .1 : .05 });
  $('#vignette').style.opacity = hookOn ? 1 : .45;
  const cornersOn = t >= 3.0 && t < 11.8; const co = P(t, 3.0, 3.4) * (1 - P(t, 11.6, 11.8));
  for (let i = 0; i < 4; i++) { const el = $('#c' + i); el.style.opacity = cornersOn ? co : (hookOn ? .7 : 0); el.style.borderColor = hookOn ? 'rgba(255,255,255,.3)' : 'rgba(0,44,105,.35)'; }
}

window.ready = (async () => {
  await document.fonts.load('900 100px Mont'); await document.fonts.load('600 100px Cinzel'); await document.fonts.load('italic 600 50px Corm');
  await document.fonts.load('700 40px Mont'); await document.fonts.load('600 16px Inter'); await document.fonts.load('700 28px Mont');
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  layout(); render(0); return true;
})();
window.render = render; window.DUR = DUR;
